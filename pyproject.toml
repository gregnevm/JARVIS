# Спільна конфігурація dev-інструментів JARVIS (mypy, pytest).
# Це НЕ пакет для встановлення — лише дім для налаштувань.
# Кожен сервіс — окремий пакет `app`, тож mypy/pytest ганяємо ПО-СЕРВІСНО
# (див. README розділ "Розробка"): інакше три пакети `app` колізують.

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
# JSON від Ollama/Telegram/n8n динамічний — повертати Any на I/O-межах нормально.
# Сигнатури лишаються повністю типізованими; це лише знімає шум на .json()/.get().
warn_return_any = false
# Конфіг спільний, а mypy ганяємо по-сервісно → кожен запуск бачить лише частину
# overrides. Без цього strict-режим сипле note про "unused section". Список
# ignore_missing_imports навмисно є суперсетом для всіх сервісів.
warn_unused_configs = false
show_error_codes = true
exclude = ['(^|/)tests/', '(^|/)\.venv/']

# Сторонні бібліотеки без type-стабів (або не встановлені в dev-оточенні).
[[tool.mypy.overrides]]
module = ["asyncpg.*", "simpleeval.*", "bs4.*", "docx.*", "pytesseract.*", "playwright.*", "TTS.*", "torch.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
# testpaths НЕ задаємо навмисно: ганяємо `pytest <service>/tests` окремо,
# бо три пакети `app` не можна збирати в одному процесі.

# R5 «Тонкий шлюз»: базовий профіль без стилістичних воєн — помилки (E), падаючі
# патерни (F), порядок імпортів (I). E501 свідомо off (довгі рядки — не бій цього гейта).
[tool.ruff]
line-length = 120
target-version = "py310"  # локальний dev-Python 3.10; прод/CI 3.11
extend-exclude = ["mobile", "extension", "db", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
