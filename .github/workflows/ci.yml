name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Типи + тести по кожному сервісу окремо: три пакети `app` не можна
  # збирати в одному процесі (колізія модуля), тож matrix із ізоляцією.
  check:
    name: ${{ matrix.service }} (mypy + pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [jarvis_core, gateway, memory, tools, twin, hostagent]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # збігається з python:3.11-slim в образах
          cache: pip
          cache-dependency-path: |
            ${{ matrix.service }}/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service }}/requirements.txt
          pip install -r requirements-dev.txt

      - name: mypy (strict)
        run: |
          if [ "${{ matrix.service }}" = "jarvis_core" ]; then
            mypy jarvis_core
          else
            mypy ${{ matrix.service }}/app
          fi

      - name: pytest
        run: |
          if [ "${{ matrix.service }}" = "jarvis_core" ]; then
            pytest jarvis_core/tests
          else
            pytest ${{ matrix.service }}/tests
          fi

  # Архітектурні гейти «Тонкого шлюза» (спека docs/REFACTOR_THIN_GATEWAY.spec.md §1).
  # R2.7: внутрішній RPC — лише через jarvis_core.service_client; httpx.AsyncClient
  # дозволений тільки виділеним клієнтам-адаптерам і 2 виняткам (probe, GitHub).
  arch-gates:
    name: architecture gates (S3/P7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: httpx.AsyncClient allowlist (R2)
        run: |
          allowed='^gateway/app/(telegram|whisper|tts_client|tools_client_base|services|admin_panel|apk_autodeliver)\.py:'
          hits=$(grep -rn "httpx\.AsyncClient(" gateway/app --include="*.py" || true)
          bad=$(echo "$hits" | grep -vE "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "::error::httpx.AsyncClient поза allowlist — використовуй jarvis_core.service_client (R2 «Тонкий шлюз»)"
            echo "$bad"
            exit 1
          fi
          echo "OK: усі httpx.AsyncClient у allowlist"

      # R4.2: env-інвентар (снапшоти + таблиця ENV_CHECKLIST) генеруються з коду;
      # drift = червоний CI (D1 машиною). Онови: python scripts/gen_env_docs.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: env drift-гейт (R4)
        run: |
          pip install -q -r requirements-dev.txt -r jarvis_core/requirements.txt pydantic-settings
          python scripts/gen_env_docs.py --check

  # Дешева перевірка: docker-compose.yml лишається валідним (синтаксис + інтерполяція .env).
  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env
      - name: Validate compose
        run: docker compose config --quiet
