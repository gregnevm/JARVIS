<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JARVIS Platform</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #070a0f; --bg2: #0e151d; --card: rgba(255,255,255,.045); --brd: rgba(255,255,255,.09);
    --txt: #e8ecf4; --muted: #8b95a8; --accent: #ff8c42; --accent2: #e85d75;
    --ok: #2dd4a7; --bad: #ff5d6c; --warn: #ffcf5c; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, "Segoe UI", sans-serif; color: var(--txt);
    background: radial-gradient(1100px 540px at 100% 0%, rgba(232,93,117,.12), transparent 50%),
      radial-gradient(820px 420px at 0% 0%, rgba(255,140,66,.10), transparent 45%), var(--bg);
    min-height: 100vh;
  }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 234px; flex-shrink: 0; border-right: 1px solid var(--brd);
    padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 16px; }
  .logo { width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; font-size: 20px; }
  .brand h1 { margin: 0; font-size: 17px; }
  .brand .sub { color: var(--muted); font-size: 11px; }
  nav.side { display: flex; flex-direction: column; gap: 3px; }
  .navitem { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
    color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
  .navitem:hover { background: var(--card); color: var(--txt); }
  .navitem.active { color: #fff; background: linear-gradient(135deg, rgba(255,140,66,.22), rgba(232,93,117,.22));
    border-color: var(--brd); }
  .navitem .ic { width: 20px; text-align: center; }
  .side-foot { margin-top: 16px; padding: 10px 12px; color: var(--muted); font-size: 11px; line-height: 1.5; }
  .main { flex: 1; padding: 22px 26px 60px; max-width: 1180px; }
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .topbar h2 { margin: 0; font-size: 22px; }
  .topbar .spacer { margin-left: auto; }
  .pill { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--brd); color: var(--muted); }
  button { border: 1px solid var(--brd); background: var(--card); color: var(--txt);
    padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; color: #fff; }
  button.danger { color: #ffb4bc; border-color: rgba(255,93,108,.4); }
  button:disabled { opacity: .5; cursor: default; }
  .section { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); margin: 20px 2px 9px; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 11px; }
  .card { background: var(--card); border: 1px solid var(--brd); border-radius: var(--radius); padding: 14px; }
  .card.wide { grid-column: 1 / -1; }
  .k { font-size: 11.5px; color: var(--muted); }
  .v { font-size: 17px; font-weight: 650; margin-top: 5px; word-break: break-word; }
  .v.sm { font-size: 14px; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 7px; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.bad { background: var(--bad); }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; display: inline-block; }
  .badge.on { background: rgba(45,212,167,.15); color: var(--ok); }
  .badge.off { background: rgba(139,149,168,.15); color: var(--muted); }
  .panel { display: none; }
  .panel.active { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--brd); vertical-align: top; }
  th { color: var(--muted); font-size: 10.5px; text-transform: uppercase; }
  input, select, textarea { font-family: inherit; background: rgba(0,0,0,.28); color: var(--txt);
    border: 1px solid var(--brd); border-radius: 9px; padding: 9px 11px; font-size: 13px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  textarea { width: 100%; resize: vertical; min-height: 78px; line-height: 1.5; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .seg { display: inline-flex; gap: 4px; background: rgba(0,0,0,.28); padding: 4px; border-radius: 11px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 13px; border-radius: 8px; }
  .seg button.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .err { display: none; background: rgba(255,93,108,.12); border: 1px solid rgba(255,93,108,.35);
    color: #ffd2d6; padding: 12px; border-radius: 12px; margin-bottom: 14px; font-size: 13px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.45; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1a2233;
    border: 1px solid var(--brd); padding: 10px 18px; border-radius: 10px; font-size: 13px; display: none; z-index: 99; }
  /* Workbench */
  .wb-out { background: rgba(0,0,0,.25); border: 1px solid var(--brd); border-radius: 12px;
    padding: 14px; min-height: 120px; white-space: pre-wrap; line-height: 1.55; font-size: 14px; }
  .trace { margin: 10px 0; display: flex; flex-direction: column; gap: 6px; }
  .trace .tool { background: rgba(255,140,66,.08); border: 1px solid rgba(255,140,66,.25);
    border-radius: 9px; padding: 8px 11px; font-size: 12.5px; }
  .trace .tool .nm { color: var(--accent); font-weight: 700; }
  .trace .tool pre { margin: 6px 0 0; white-space: pre-wrap; color: var(--muted); font-size: 12px; max-height: 180px; overflow: auto; }
  .confirm-card { display: none; border: 1px solid rgba(255,207,92,.35); background: rgba(255,207,92,.08);
    border-radius: 12px; padding: 12px; margin: 10px 0; }
  .confirm-card.show { display: block; }
  .confirm-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn-ok { border: 0; background: var(--ok); color: #041; padding: 8px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
  .btn-no { border: 1px solid var(--brd); background: var(--card); color: var(--txt);
    padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  .settings-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; }
  .settings-row .lbl { color: var(--muted); }
  .switch { position: relative; width: 42px; height: 24px; }
  .switch input { display: none; }
  .switch .sl { position: absolute; inset: 0; background: rgba(139,149,168,.3); border-radius: 999px; transition: .2s; cursor: pointer; }
  .switch .sl::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .sl { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .switch input:checked + .sl::before { transform: translateX(18px); }
  .empty { color: var(--muted); font-size: 13px; padding: 16px 4px; }
  a.link { color: var(--accent); text-decoration: none; }
  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; border-right: 0; border-bottom: 1px solid var(--brd); }
    nav.side { flex-direction: row; flex-wrap: wrap; }
    .navitem { font-size: 12.5px; padding: 8px 10px; }
    .side-foot { display: none; }
    .main { padding: 16px 14px 50px; }
  }
</style>
</head>
<body>

  <aside class="sidebar">

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
const initData = (tg && tg.initData) || "";

const TITLES = { overview:"Огляд", workbench:"Workbench", memory:"Памʼять",
  projects:"Проєкти", jobs:"Background Jobs", planning:"Planning", research:"Deep Research",
  mcp:"MCP", connectors:"Connectors", skills:"Skills", subagents:"Subagents", teams:"Agent Teams",
  hooks:"Hooks",
  logs:"Логи", settings:"Налаштування", users:"Доступ", models:"Моделі" };

function headers(extra) {
  const h = Object.assign({ "Content-Type": "application/json" }, extra || {});
  if (initData) h["X-Telegram-Init-Data"] = initData;
  return h;
}
async function api(path, opts) {
  opts = opts || {};
  const r = await fetch(path, { headers: headers(opts.headers), method: opts.method || "GET",
    body: opts.body ? JSON.stringify(opts.body) : undefined, credentials: "same-origin" });
  if (!r.ok) {
    let detail = r.status + "";
    try { detail = (await r.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return r.json();
}
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), 2600);
}
function showErr(msg) {
  const e = document.getElementById("err");
  if (!msg) { e.style.display = "none"; return; }
  e.textContent = "⚠ " + msg; e.style.display = "block";
}
const dot = (ok) => `<span class="dot ${ok ? "ok" : "bad"}"></span>`;
const badge = (on) => `<span class="badge ${on ? "on" : "off"}">${on ? "увімкнено" : "вимкнено"}</span>`;
const card = (k, v, cls) => `<div class="card"><div class="k">${esc(k)}</div><div class="v ${cls||""}">${v}</div></div>`;
const fmtBytes = (n) => !n ? "0" : n > 1e9 ? (n/1e9).toFixed(1)+" GB" : n > 1e6 ? (n/1e6).toFixed(1)+" MB" : (n/1e3).toFixed(0)+" KB";

let current = "overview";
function switchTab(tab) {
  current = tab;
  document.querySelectorAll(".navitem").forEach((n) => n.classList.toggle("active", n.dataset.tab === tab));
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "panel-" + tab));
  document.getElementById("title").textContent = TITLES[tab];
  showErr("");
  RENDER[tab] && RENDER[tab]();
}
document.getElementById("nav").addEventListener("click", (e) => {
  const item = e.target.closest(".navitem"); if (item) switchTab(item.dataset.tab);
});
document.getElementById("btnRefresh").addEventListener("click", () => RENDER[current] && RENDER[current]());

// ---------------- Overview ----------------
async function renderOverview() {
  const el = document.getElementById("panel-overview");
  el.innerHTML = '<div class="empty">Завантаження…</div>';
  let d;
  try { d = await api("/platform/api/overview"); } catch (e) { showErr(e.message); el.innerHTML = ""; return; }
  document.getElementById("authPill").textContent = "auth: " + (d.auth_via || "?");
  const m = d.metrics || {}, t = m.turn_ms || {}, ts = m.tok_s || {};
  const models = d.models || {};
  let html = "";
  html += '<div class="section">Стек (runtime)</div><div class="grid">';
  for (const [k, v] of Object.entries(d.stack || {}))
    html += card(v.label || k, dot(v.ok) + (v.ok ? "ok" : "fail"), "sm");
  html += "</div>";
  html += '<div class="section">Сервіси (HTTP)</div><div class="grid">';
  for (const s of d.services || [])
    html += card(s.name, dot(s.ok) + (s.ok ? `${s.status} · ${s.ms}ms` : "down"), "sm");
  html += "</div>";
  html += '<div class="section">Inference</div><div class="grid">';
  html += card("Ollama", dot(models.ollama_up) + esc(models.ollama_host), "sm mono");
  html += card("CHAT", esc(models.chat_model || "—"), "sm mono");
  html += card("AGENT", esc(models.agent_model || "—"), "sm mono");
  html += card("Режим агента", esc(d.agent_mode || "—"), "sm");
  html += "</div>";
  html += '<div class="section">Метрики (rolling)</div><div class="grid">';
  html += card("Turn p50", (t.p50_ms || 0) + " ms");
  html += card("Turn p95", (t.p95_ms || 0) + " ms");
  html += card("Turn avg", (t.avg_ms || 0) + " ms · n=" + (t.count || 0), "sm");
  html += card("tok/s p50", (ts.p50 || 0) + " · n=" + (ts.count || 0), "sm");
  html += card("tok/s p95", (ts.p95 || 0), "sm");
  html += card("RAG hit-rate", Math.round((m.rag_hit_rate || 0) * 100) + "% · q=" + (m.rag_queries || 0), "sm");
  html += "</div>";
  const tools = m.tools || {};
  if (Object.keys(tools).length) {
    html += '<div class="section">Латентність інструментів</div><div class="card wide"><table>';
    html += "<tr><th>Tool</th><th>n</th><th>p50</th><th>p95</th></tr>";
    for (const [nm, s] of Object.entries(tools))
      html += `<tr><td class="mono">${esc(nm)}</td><td>${s.count}</td><td>${s.p50_ms}ms</td><td>${s.p95_ms}ms</td></tr>`;
    html += "</table></div>";
  }
  el.innerHTML = html;
}

// ---------------- Workbench ----------------
let wbMode = "auto";
let wbPendingCode = null;
const _WB_ADMIN_RE = /\[\[COMPUTER_ADMIN_CONFIRM:([a-f0-9]+)\]\]/;
function wbParseAdminConfirm(text) {
  const m = _WB_ADMIN_RE.exec(text || "");
  return m ? m[1] : null;
}
function wbShowConfirm(show, desc, code) {
  const card = document.getElementById("wbConfirm");
  if (!card) return;
  card.classList.toggle("show", !!show);
  const descEl = document.getElementById("wbConfirmDesc");
  if (descEl) descEl.textContent = desc || "";
  wbPendingCode = show ? (code || wbPendingCode) : null;
}
async function wbProcessStream(resp, ctx) {
  const out = ctx.out, trace = ctx.trace, st = ctx.st;
  let acc = ctx.acc || "";
  const toolEls = ctx.toolEls || {};
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 2);
      if (!line.startsWith("data:")) continue;
      let ev;
      try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
      if (ev.delta) { acc += ev.delta; out.textContent = acc; }
      else if (ev.status && !acc) st.textContent = ev.status;
      else if (ev.tool_start) {
        const nm = ev.tool_start.name;
        const div = document.createElement("div");
        div.className = "tool";
        div.innerHTML = `<span class="nm">▶ ${esc(nm)}</span><pre>${esc(JSON.stringify(ev.tool_start.args || {}))}</pre>`;
        trace.appendChild(div);
        toolEls[nm] = div;
      } else if (ev.tool_done) {
        const div = toolEls[ev.tool_done.name];
        if (div) div.innerHTML += `<pre>✓ ${esc(String(ev.tool_done.result || "").slice(0, 1200))}</pre>`;
      } else if (ev.confirm) {
        wbShowConfirm(true, ev.confirm.desc || "Потрібне підтвердження", ev.confirm.code || null);
        st.textContent = "⏸ очікує confirm";
        return { paused: true, acc };
      } else if (ev.done) {
        if (ev.text) { acc = ev.text; out.textContent = acc; }
        st.textContent = "готово · " + esc(ev.mode || "") + " · " + (ev.iters || 0) + " iters";
      }
    }
  }
  return { paused: false, acc };
}
function renderWorkbench() {
  const el = document.getElementById("panel-workbench");
  if (el.dataset.init) return;
  el.dataset.init = "1";
  const modes = ["auto", "chat", "agent", "hybrid", "computer"];
  el.innerHTML =
    '<div class="seg" id="wbSeg">' + modes.map((m) =>
      `<button data-m="${m}" class="${m === wbMode ? "active" : ""}">${m}</button>`).join("") + "</div>" +
    '<textarea id="wbInput" placeholder="Запит до агента… (Ctrl+Enter — надіслати)"></textarea>' +
    '<div class="toolbar" style="margin-top:10px"><button class="primary" id="wbSend">▶ Надіслати</button>' +
    '<span class="pill" id="wbStatus">готово</span></div>' +
    '<div class="confirm-card" id="wbConfirm">' +
    '<div class="k" style="color:var(--warn)">Потрібне підтвердження Computer Use</div>' +
    '<div id="wbConfirmDesc" class="mono" style="margin-top:8px;font-size:12px;white-space:pre-wrap"></div>' +
    '<div class="confirm-actions"><button type="button" class="btn-ok" id="wbApprove">Approve</button>' +
    '<button type="button" class="btn-no" id="wbDeny">Deny</button></div></div>' +
    '<div class="trace" id="wbTrace"></div>' +
    '<div class="section">Відповідь</div><div class="wb-out" id="wbOut"></div>';
  el.querySelector("#wbSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    wbMode = b.dataset.m;
    el.querySelectorAll("#wbSeg button").forEach((x) => x.classList.toggle("active", x === b));
  });
  el.querySelector("#wbSend").addEventListener("click", wbSend);
  el.querySelector("#wbApprove").addEventListener("click", wbApprove);
  el.querySelector("#wbDeny").addEventListener("click", wbDeny);
  el.querySelector("#wbInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) wbSend();
  });
}
async function wbSend() {
  const input = document.getElementById("wbInput");
  const text = input.value.trim(); if (!text) return;
  const out = document.getElementById("wbOut"), trace = document.getElementById("wbTrace");
  const st = document.getElementById("wbStatus"), btn = document.getElementById("wbSend");
  out.textContent = ""; trace.innerHTML = ""; wbShowConfirm(false); st.textContent = "стрім…"; btn.disabled = true;
  try {
    const resp = await fetch("/platform/api/workbench/ask", { method: "POST",
      headers: headers(), credentials: "same-origin", body: JSON.stringify({ text, mode: wbMode }) });
    if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
    await wbProcessStream(resp, { out, trace, st, acc: "" });
  } catch (e) { showErr(e.message); st.textContent = "помилка"; }
  btn.disabled = false;
}
async function wbResume(result, origin) {
  const out = document.getElementById("wbOut"), trace = document.getElementById("wbTrace");
  const st = document.getElementById("wbStatus"), btn = document.getElementById("wbSend");
  st.textContent = "resume…"; btn.disabled = true;

      body: JSON.stringify({ result, origin: origin || "", mode: wbMode }) });

    await wbProcessStream(resp, { out, trace, st, acc: out.textContent || "" });

async function projDelFile(id, fid) {

// ---------------- Jobs (P2) ----------------
let jobsTimer = null;
function jobStatusBadge(st) {
  const s = String(st || "?");
  const cls = s === "done" ? "on" : (s === "failed" ? "off" : "on");
  return `<span class="badge ${cls}">${esc(s)}</span>`;
}
function renderJobs() {
  const el = document.getElementById("panel-jobs");
  if (!el.dataset.init) {
    el.dataset.init = "1";
    el.innerHTML =
      '<div class="toolbar"><textarea id="jobText" placeholder="Запит для background agent…" style="flex:1;min-width:200px;min-height:56px"></textarea>' +
      '<select id="jobType"><option value="agent_turn">agent_turn</option><option value="deep_research">deep_research</option><option value="subagent">subagent</option><option value="agent_team">agent_team</option></select>' +
      '<select id="jobMode"><option value="auto">auto</option><option value="chat">chat</option>' +
      '<option value="agent">agent</option><option value="hybrid">hybrid</option></select>' +
      '<button class="primary" id="jobCreate">+ Створити job</button>' +
      '<label class="chk" style="font-size:12px;color:var(--muted)"><input type="checkbox" id="jobAuto" checked /> авто 5с</label></div>' +
      '<div id="jobsOut"></div>';
    el.querySelector("#jobCreate").addEventListener("click", jobCreate);
    el.querySelector("#jobAuto").addEventListener("change", (ev) => {
      clearInterval(jobsTimer);
      if (ev.target.checked) jobsTimer = setInterval(loadJobs, 5000);
    });
  }
  loadJobs();
  clearInterval(jobsTimer);
  const auto = document.getElementById("jobAuto");
  if (auto && auto.checked) jobsTimer = setInterval(loadJobs, 5000);
}
async function jobCreate() {
  const text = document.getElementById("jobText").value.trim();
  if (!text) return toast("вкажи текст");
  try {
    const mode = document.getElementById("jobMode").value;
    const job_type = document.getElementById("jobType").value;
    const j = await api("/platform/api/jobs", { method: "POST", body: { text, mode, job_type } });
    toast("job " + j.id); document.getElementById("jobText").value = ""; loadJobs();
  } catch (e) { showErr(e.message); }
}
async function loadJobs() {
  const out = document.getElementById("jobsOut"); if (!out) return;
  try {
    const d = await api("/platform/api/jobs?limit=25");
    if (!d.jobs.length) { out.innerHTML = '<div class="empty">Немає jobs.</div>'; return; }
    let h = '<div class="card wide"><table><tr><th>ID</th><th>Status</th><th>Progress</th><th>Створено</th><th>Payload</th><th></th></tr>';
    for (const j of d.jobs) {
      const ts = j.created_at ? new Date(j.created_at * 1000).toLocaleString("uk-UA") : "—";
      const pl = esc(JSON.stringify(j.payload || {}).slice(0, 80));
      const cancel = j.status === "queued"
        ? `<button class="danger" data-jcancel="${esc(j.id)}">cancel</button>` : "";
      h += `<tr><td class="mono">${esc(j.id)}</td><td>${jobStatusBadge(j.status)}</td><td>${j.progress||0}%</td>` +
        `<td class="mono">${ts}</td><td class="mono">${esc(j.type||"agent_turn")}: ${pl}</td><td>${cancel}</td></tr>`;
      if (j.result) h += `<tr><td colspan="6" class="lbl">→ ${esc(String(j.result).slice(0,300))}</td></tr>`;
      if (j.error) h += `<tr><td colspan="6" class="lbl" style="color:var(--bad)">✗ ${esc(j.error)}</td></tr>`;
    }
    out.innerHTML = h + "</table></div>";
    out.querySelectorAll("[data-jcancel]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        try { await api("/platform/api/jobs/" + btn.dataset.jcancel, { method: "DELETE" }); toast("cancelled"); loadJobs(); }
        catch (e) { showErr(e.message); }
      });
    });
  } catch (e) { showErr(e.message); out.innerHTML = ""; }
}

// ---------------- Planning (P3) ----------------
let planPoll = null;
let activePlanId = null;
function planBadge(st) {
  const s = String(st || "?");
  return `<span class="badge on">${esc(s)}</span>`;
}
function renderPlanning() {
  const el = document.getElementById("panel-planning");
  if (!el.dataset.init) {
    el.dataset.init = "1";
    el.innerHTML =
      '<div class="toolbar"><textarea id="planText" placeholder="Опиши задачу для плану…" style="flex:1;min-width:200px;min-height:56px"></textarea>' +
      '<button class="primary" id="planCreate">Створити план</button></div>' +
      '<div id="planViewer"></div><div id="plansList"></div>';
    el.querySelector("#planCreate").addEventListener("click", planCreate);
  }
  loadPlansList();
}
async function planCreate() {
  const text = document.getElementById("planText").value.trim();
  if (!text) return toast("вкажи задачу");
  try {
    const p = await api("/platform/api/plans", { method: "POST", body: { text } });
    activePlanId = p.id; toast("plan " + p.id); planShow(p); loadPlansList();
  } catch (e) { showErr(e.message); }
}
function planShow(p) {
  activePlanId = p.id;
  const v = document.getElementById("planViewer");
  let steps = (p.steps || []).map((s) =>
    `<tr><td>${s.id}</td><td>${esc(s.title)}</td><td>${esc(s.status||"pending")}</td><td class="mono">${esc((s.detail||"").slice(0,120))}</td></tr>`
  ).join("");
  const risks = (p.risks || []).map((r) => `<li>${esc(r)}</li>`).join("");
  const canApprove = p.status === "pending";
  const canExec = p.status === "approved";
  v.innerHTML =
    `<div class="card wide"><h3>${esc(p.summary||"")} ${planBadge(p.status)}</h3>` +
    `<p class="mono">ID: ${esc(p.id)}</p>` +
    (risks ? `<ul>${risks}</ul>` : "") +
    `<table><tr><th>#</th><th>Крок</th><th>Status</th><th>Detail</th></tr>${steps}</table>` +
    `<div class="toolbar">` +
    (canApprove ? '<button class="primary" id="planApprove">Approve</button><button class="danger" id="planDeny">Deny</button>' : "") +
    (canExec ? '<button class="primary" id="planExec">Execute</button>' : "") +
    `</div>` +
    (p.result ? `<pre class="mono">${esc(String(p.result).slice(0,4000))}</pre>` : "") +
    `</div>`;
  const ap = document.getElementById("planApprove");
  if (ap) ap.addEventListener("click", () => planAction("approve"));
  const dn = document.getElementById("planDeny");
  if (dn) dn.addEventListener("click", () => planAction("deny"));
  const ex = document.getElementById("planExec");
  if (ex) ex.addEventListener("click", () => planAction("execute"));
  if (p.status === "executing") startPlanPoll(p.id);
  else clearInterval(planPoll);
}
async function planAction(action) {
  if (!activePlanId) return;
  try {
    if (action === "execute") {
      toast("executing…");
      const r = await api("/platform/api/plans/" + activePlanId + "/execute", { method: "POST", body: {} });
      planShow(r.plan || r);
    } else {
      const r = await api("/platform/api/plans/" + activePlanId + "/" + action, { method: "POST", body: {} });
      planShow(r);
    }
    loadPlansList();
  } catch (e) { showErr(e.message); }
}
function startPlanPoll(id) {
  clearInterval(planPoll);
  planPoll = setInterval(async () => {
    try {
      const p = await api("/platform/api/plans/" + id);
      planShow(p);
      if (p.status !== "executing") clearInterval(planPoll);
    } catch (e) { clearInterval(planPoll); }
  }, 3000);
}
async function loadPlansList() {
  const out = document.getElementById("plansList"); if (!out) return;
  try {
    const d = await api("/platform/api/plans?limit=15");
    if (!d.plans.length) { out.innerHTML = '<div class="empty">Планів ще немає.</div>'; return; }
    let h = '<div class="card wide"><table><tr><th>ID</th><th>Status</th><th>Summary</th></tr>';
    for (const p of d.plans) {
      h += `<tr style="cursor:pointer" data-pid="${esc(p.id)}"><td class="mono">${esc(p.id)}</td><td>${planBadge(p.status)}</td><td>${esc((p.summary||"").slice(0,80))}</td></tr>`;
    }
    out.innerHTML = h + "</table></div>";
    out.querySelectorAll("[data-pid]").forEach((row) => {
      row.addEventListener("click", async () => {
        const p = await api("/platform/api/plans/" + row.dataset.pid);
        planShow(p);
      });
    });
  } catch (e) { showErr(e.message); }
}

async function loadMcp() {
