<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JARVIS Platform</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #070a0f; --bg2: #0e151d; --card: rgba(255,255,255,.045); --brd: rgba(255,255,255,.09);
    --txt: #e8ecf4; --muted: #8b95a8; --accent: #ff8c42; --accent2: #e85d75;
    --ok: #2dd4a7; --bad: #ff5d6c; --warn: #ffcf5c; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, "Segoe UI", sans-serif; color: var(--txt);
    -webkit-font-smoothing: antialiased;
    background: radial-gradient(1100px 540px at 100% 0%, rgba(232,93,117,.12), transparent 50%),
      radial-gradient(820px 420px at 0% 0%, rgba(255,140,66,.10), transparent 45%), var(--bg);
    min-height: 100vh;
    padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
  }
  .app { display: flex; min-height: 100vh; }
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; }
  .sidebar-overlay.open { display: block; }
  .sidebar { width: 234px; flex-shrink: 0; border-right: 1px solid var(--brd);
    padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    background: var(--bg); z-index: 41; }
  .brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 16px; }
  .logo { width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; font-size: 20px; }
  .brand h1 { margin: 0; font-size: 17px; }
  .brand .sub { color: var(--muted); font-size: 11px; }
  nav.side { display: flex; flex-direction: column; gap: 2px; }
  .nav-group { margin-bottom: 8px; }
  .nav-group-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); padding: 6px 12px 4px; font-weight: 700; opacity: .85; }
  .navitem { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px;
    color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; border: 1px solid transparent;
    background: transparent; width: 100%; text-align: left; font-family: inherit; line-height: 1.3; }
  .navitem:hover { background: var(--card); color: var(--txt); }
  .navitem.active { color: #fff; background: linear-gradient(135deg, rgba(255,140,66,.22), rgba(232,93,117,.22));
    border-color: var(--brd); }
  .navitem .ic { width: 20px; text-align: center; flex-shrink: 0; }
  .side-foot { margin-top: 16px; padding: 10px 12px; color: var(--muted); font-size: 11px; line-height: 1.5; }
  .main { flex: 1; padding: 22px 26px 60px; max-width: 1180px; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
    padding-top: env(safe-area-inset-top); position: sticky; top: 0; z-index: 10;
    background: linear-gradient(var(--bg) 70%, transparent); }
  .topbar h2 { margin: 0; font-size: 20px; line-height: 1.25; }
  .topbar .spacer { margin-left: auto; }
  .btn-menu { display: none; padding: 8px 12px; }
  .pill { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--brd); color: var(--muted); }
  button { border: 1px solid var(--brd); background: var(--card); color: var(--txt);
    padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button:active:not(:disabled) { transform: scale(.97); }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; color: #fff; }
  button.danger { color: #ffb4bc; border-color: rgba(255,93,108,.4); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, .navitem:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-refresh.spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .section { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); margin: 20px 2px 9px; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 11px; }
  .card { background: var(--card); border: 1px solid var(--brd); border-radius: var(--radius); padding: 14px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .card.skeleton { min-height: 72px; animation: skel-pulse 1.4s ease-in-out infinite; }
  @keyframes skel-pulse { 0%,100%{opacity:.45} 50%{opacity:.9} }
  .card.wide { grid-column: 1 / -1; }
  .k { font-size: 11.5px; color: var(--muted); }
  .v { font-size: 17px; font-weight: 650; margin-top: 5px; word-break: break-word; }
  .v.sm { font-size: 14px; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 7px; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.bad { background: var(--bad); }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; display: inline-block; }
  .badge.on { background: rgba(45,212,167,.15); color: var(--ok); }
  .badge.off { background: rgba(139,149,168,.15); color: var(--muted); }
  .panel { display: none; }
  .panel.active { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--brd); vertical-align: top; }
  th { color: var(--muted); font-size: 10.5px; text-transform: uppercase; }
  input, select, textarea { font-family: inherit; background: rgba(0,0,0,.28); color: var(--txt);
    border: 1px solid var(--brd); border-radius: 9px; padding: 9px 11px; font-size: 13px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  textarea { width: 100%; resize: vertical; min-height: 78px; line-height: 1.5; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .seg { display: inline-flex; gap: 4px; background: rgba(0,0,0,.28); padding: 4px; border-radius: 11px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 13px; border-radius: 8px; }
  .seg button.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .err { display: none; background: rgba(255,93,108,.12); border: 1px solid rgba(255,93,108,.35);
    color: #ffd2d6; padding: 12px; border-radius: 12px; margin-bottom: 14px; font-size: 13px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.45; }
  .toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    background: #1a2233; border: 1px solid var(--brd); padding: 10px 18px; border-radius: 10px;
    font-size: 13px; display: none; z-index: 99; max-width: 92vw; text-align: center; }
  .toast.err { border-color: rgba(255,93,108,.5); background: rgba(40,12,18,.95); color: #ffd2d6; }
  .toast .toast-link { color: var(--accent); cursor: pointer; text-decoration: underline; margin-left: 8px; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -2px; }
  .err-inline { background: rgba(255,93,108,.1); border: 1px solid rgba(255,93,108,.3);
    color: #ffd2d6; padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 13px; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 60;
    align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--brd); border-radius: 16px; padding: 20px;
    max-width: 420px; width: 100%; }
  .modal h3 { margin: 0 0 8px; font-size: 17px; }
  .modal p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0; }
  .modal-btns { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
  .drawer-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 45; }
  .drawer-backdrop.open { display: block; }
  .drawer-right { position: fixed; top: 0; right: 0; width: min(480px, 100vw); height: 100vh;
    background: var(--bg2); border-left: 1px solid var(--brd); z-index: 46; padding: 20px 18px;
    overflow-y: auto; transform: translateX(100%); transition: transform .25s ease;
    padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
  .drawer-right.open { transform: translateX(0); }
  .drawer-right .drawer-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .drawer-right .drawer-head h3 { margin: 0; flex: 1; font-size: 16px; }
  tr.job-highlight td { background: rgba(255,140,66,.12); }
  /* Workbench */
  .wb-out { background: rgba(0,0,0,.25); border: 1px solid var(--brd); border-radius: 12px;
    padding: 14px; min-height: 120px; line-height: 1.55; font-size: 14px; word-break: break-word; }
  .wb-out pre { background: rgba(0,0,0,.35); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; }
  .wb-out code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px;
    background: rgba(0,0,0,.3); padding: 2px 5px; border-radius: 4px; }
  .trace { margin: 10px 0; display: flex; flex-direction: column; gap: 6px; }
  .trace .tool { background: rgba(255,140,66,.08); border: 1px solid rgba(255,140,66,.25);
    border-radius: 9px; padding: 8px 11px; font-size: 12.5px; }
  .trace .tool .nm { color: var(--accent); font-weight: 700; }
  .trace .tool pre { margin: 6px 0 0; white-space: pre-wrap; color: var(--muted); font-size: 12px; max-height: 180px; overflow: auto; }
  .confirm-card { display: none; border: 1px solid rgba(255,207,92,.35); background: rgba(255,207,92,.08);
    border-radius: 12px; padding: 12px; margin: 10px 0; }
  .confirm-card.show { display: block; }
  .confirm-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn-ok { border: 0; background: var(--ok); color: #041; padding: 8px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
  .btn-no { border: 1px solid var(--brd); background: var(--card); color: var(--txt);
    padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  .settings-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; }
  .settings-row .lbl { color: var(--muted); }
  .switch { position: relative; width: 42px; height: 24px; }
  .switch input { display: none; }
  .switch .sl { position: absolute; inset: 0; background: rgba(139,149,168,.3); border-radius: 999px; transition: .2s; cursor: pointer; }
  .switch .sl::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .sl { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .switch input:checked + .sl::before { transform: translateX(18px); }
  .empty { color: var(--muted); font-size: 13px; padding: 16px 4px; }
  a.link { color: var(--accent); text-decoration: none; }
  @media (max-width: 760px) {
    .btn-menu { display: inline-block; }
    .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .25s ease;
      width: min(280px, 88vw); height: 100vh; border-right: 1px solid var(--brd); }
    .sidebar.open { transform: translateX(0); }
    .main { padding: 12px 14px calc(50px + env(safe-area-inset-bottom)); width: 100%; }
    .topbar h2 { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">🧭</div>
      <div><h1>Platform</h1><div class="sub" id="brandSub">JARVIS console</div></div>
    </div>
    <nav class="side" id="nav" role="tablist">
      <div class="nav-group">
        <div class="nav-group-label">Робочий стіл / Workspace</div>
        <button type="button" class="navitem active" data-tab="overview" role="tab" aria-selected="true"><span class="ic">📊</span> Огляд / Overview</button>
        <button type="button" class="navitem" data-tab="workbench" role="tab" aria-selected="false"><span class="ic">⚡</span> Workbench</button>
        <button type="button" class="navitem" data-tab="memory" role="tab" aria-selected="false"><span class="ic">🧠</span> Памʼять / Memory</button>
        <button type="button" class="navitem" data-tab="projects" role="tab" aria-selected="false"><span class="ic">📁</span> Проєкти / Projects</button>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">Автоматизація / Automation</div>

        <button type="button" class="navitem" data-tab="planning" role="tab" aria-selected="false"><span class="ic">📋</span> Planning / Плани</button>
        <button type="button" class="navitem" data-tab="research" role="tab" aria-selected="false"><span class="ic">🔬</span> Research</button>
        <button type="button" class="navitem" data-tab="subagents" role="tab" aria-selected="false"><span class="ic">🤖</span> Subagents</button>
        <button type="button" class="navitem" data-tab="teams" role="tab" aria-selected="false"><span class="ic">👥</span> Teams</button>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">Інтеграції / Integrations</div>
        <button type="button" class="navitem" data-tab="mcp" role="tab" aria-selected="false"><span class="ic">🔌</span> MCP</button>
        <button type="button" class="navitem" data-tab="connectors" role="tab" aria-selected="false"><span class="ic">🔗</span> Connectors</button>
        <button type="button" class="navitem" data-tab="skills" role="tab" aria-selected="false"><span class="ic">🎯</span> Skills</button>
        <button type="button" class="navitem" data-tab="hooks" role="tab" aria-selected="false"><span class="ic">🪝</span> Hooks</button>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">Система / System</div>
        <button type="button" class="navitem" data-tab="logs" role="tab" aria-selected="false"><span class="ic">📜</span> Логи / Logs</button>
        <button type="button" class="navitem" data-tab="settings" role="tab" aria-selected="false"><span class="ic">⚙️</span> Налаштування / Settings</button>
        <button type="button" class="navitem" data-tab="users" role="tab" aria-selected="false"><span class="ic">🔐</span> Доступ / Access</button>
        <button type="button" class="navitem" data-tab="models" role="tab" aria-selected="false"><span class="ic">📦</span> Моделі / Models</button>
        <button type="button" class="navitem" data-tab="improve" role="tab" aria-selected="false"><span class="ic">✨</span> Покращення / Improve</button>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">Платформа API / Developer</div>
        <button type="button" class="navitem" data-tab="developer" role="tab" aria-selected="false"><span class="ic">🔑</span> API ключі / API Keys</button>
        <button type="button" class="navitem" data-tab="playground" role="tab" aria-selected="false"><span class="ic">🛝</span> Playground</button>
      </div>
    </nav>
    <div class="side-foot">
      Self-hosted · без зовнішніх API.<br />
      <a class="link" href="/admin">Legacy admin →</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button type="button" class="btn-menu" id="btnMenu" aria-label="Меню / Menu">☰</button>
      <h2 id="title">Огляд / Overview</h2>
      <div class="spacer"></div>
      <span class="pill" id="authPill">…</span>
      <button type="button" class="btn-refresh" id="btnRefresh">⟳ Оновити / Refresh</button>

    <section class="panel active" id="panel-overview" role="tabpanel"></section>
    <section class="panel" id="panel-workbench" role="tabpanel"></section>
    <section class="panel" id="panel-memory" role="tabpanel"></section>
    <section class="panel" id="panel-projects" role="tabpanel"></section>
    <section class="panel" id="panel-jobs" role="tabpanel"></section>

    <section class="panel" id="panel-skills" role="tabpanel"></section>
    <section class="panel" id="panel-subagents" role="tabpanel"></section>
    <section class="panel" id="panel-teams" role="tabpanel"></section>

    <section class="panel" id="panel-improve" role="tabpanel"></section>

  </main>
</div>
<div class="drawer-backdrop" id="projDrawerBg"></div>
<aside class="drawer-right" id="projDrawer" aria-hidden="true"></aside>
<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle">Підтвердження / Confirm</h3>
    <p id="modalText"></p>
    <div class="modal-btns">
      <button type="button" id="modalCancel">Скасувати / Cancel</button>
      <button type="button" class="primary" id="modalOk">Підтвердити / Confirm</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
const initData = (tg && tg.initData) || "";

const lbl = (uk, en) => uk + " / " + en;
const LOADING = lbl("Завантаження…", "Loading…");
const TITLES = {
  overview: lbl("Огляд", "Overview"), workbench: "Workbench", memory: lbl("Памʼять", "Memory"),
  projects: lbl("Проєкти", "Projects"), jobs: lbl("Завдання", "Jobs"), planning: lbl("Планування", "Planning"),
  research: lbl("Дослідження", "Research"), mcp: "MCP", connectors: "Connectors", skills: "Skills",
  subagents: "Subagents", teams: lbl("Команди", "Teams"), hooks: "Hooks",
  logs: lbl("Логи", "Logs"), settings: lbl("Налаштування", "Settings"), users: lbl("Доступ", "Access"),
  models: lbl("Моделі", "Models"), improve: lbl("Покращення", "Improve"),
  developer: lbl("API ключі", "API Keys"), playground: "Playground",
};

let pendingAction = null;
let jobsTimer = null;
let planPoll = null;
let highlightJobId = null;
let wbAbort = null;

function headers(extra) {
  const h = Object.assign({ "Content-Type": "application/json" }, extra || {});
  if (initData) h["X-Telegram-Init-Data"] = initData;
  return h;
}
async function api(path, opts) {
  opts = opts || {};
  const r = await fetch(path, { headers: headers(opts.headers), method: opts.method || "GET",
    body: opts.body ? JSON.stringify(opts.body) : undefined, credentials: "same-origin" });
  if (!r.ok) {
    let detail = r.status + "";
    try { detail = (await r.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return r.json();
}
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
function toast(msg, type, linkFn, linkText) {
  const t = document.getElementById("toast");
  t.className = "toast" + (type === "err" ? " err" : "");
  t.textContent = "";
  t.appendChild(document.createTextNode(msg));
  if (linkFn) {
    const a = document.createElement("span");
    a.className = "toast-link";
    a.textContent = linkText || lbl("відкрити", "open");
    a.onclick = () => { t.style.display = "none"; linkFn(); };
    t.appendChild(a);
  }
  t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), linkFn ? 5000 : 2800);
}
function showErr(msg) {
  const e = document.getElementById("err");
  if (!msg) { e.style.display = "none"; return; }
  e.textContent = "⚠ " + msg; e.style.display = "block";
  toast(msg, "err");
}
function confirmModal(title, text, fn) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalText").textContent = text;
  pendingAction = fn;
  document.getElementById("modalBg").classList.add("open");
}
document.getElementById("modalCancel").onclick = () => {
  pendingAction = null; document.getElementById("modalBg").classList.remove("open");
};
document.getElementById("modalOk").onclick = async () => {
  const fn = pendingAction; pendingAction = null;
  document.getElementById("modalBg").classList.remove("open");
  if (fn) await fn();
};
function tableWrap(inner) { return `<div class="table-wrap">${inner}</div>`; }
function skeletonGrid(n) {
  let h = '<div class="grid">';
  for (let i = 0; i < (n || 4); i++) h += '<div class="card skeleton"></div>';
  return h + "</div>";
}
function setAuthPill(v) {
  const el = document.getElementById("authPill");
  const m = { telegram: "Telegram ✓", basic: lbl("Basic Auth", "Basic Auth"), cookie: "Cookie" };
  el.textContent = m[v] || (v || "?");
}
function mdSimple(text) {
  let s = esc(text || "");
  s = s.replace(/```([\s\S]*?)```/g, (_, c) => "<pre>" + c + "</pre>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\n/g, "<br>");
  return s;
}

function switchTab(tab, pushHash) {
  if (pushHash !== false && TITLES[tab]) history.replaceState(null, "", "#" + tab);
  if (tab !== "jobs") { clearInterval(jobsTimer); jobsTimer = null; }
  if (tab !== "planning") { clearInterval(planPoll); planPoll = null; }
  current = tab;
  document.querySelectorAll(".navitem").forEach((n) => {
    const on = n.dataset.tab === tab;
    n.classList.toggle("active", on);
    n.setAttribute("aria-selected", on ? "true" : "false");
  });
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "panel-" + tab));
  document.getElementById("title").textContent = TITLES[tab] || tab;
  showErr("");
  closeSidebar();

}

let wbMode = "auto";
let wbPendingCode = null;
const _WB_ADMIN_RE = /\[\[COMPUTER_ADMIN_CONFIRM:([a-f0-9]+)\]\]/;
function wbParseAdminConfirm(text) {
  const m = _WB_ADMIN_RE.exec(text || "");
  return m ? m[1] : null;
}
function wbShowConfirm(show, desc, code) {
  const card = document.getElementById("wbConfirm");
  if (!card) return;
  card.classList.toggle("show", !!show);
  const descEl = document.getElementById("wbConfirmDesc");
  if (descEl) descEl.textContent = desc || "";
  wbPendingCode = show ? (code || wbPendingCode) : null;
}
async function wbProcessStream(resp, ctx) {
  const out = ctx.out, trace = ctx.trace, st = ctx.st;
  let acc = ctx.acc || "";
  const toolEls = ctx.toolEls || {};
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 2);
      if (!line.startsWith("data:")) continue;
      let ev;
      try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
      if (ev.delta) { acc += ev.delta; out.dataset.raw = acc; out.innerHTML = mdSimple(acc); }
      else if (ev.status && !acc) st.textContent = ev.status;
      else if (ev.tool_start) {
        const nm = ev.tool_start.name;
        const div = document.createElement("div");
        div.className = "tool";
        div.innerHTML = `<span class="nm">▶ ${esc(nm)}</span><pre>${esc(JSON.stringify(ev.tool_start.args || {}))}</pre>`;
        trace.appendChild(div);
        toolEls[nm] = div;
      } else if (ev.tool_done) {
        const div = toolEls[ev.tool_done.name];
        if (div) div.innerHTML += `<pre>✓ ${esc(String(ev.tool_done.result || "").slice(0, 1200))}</pre>`;
      } else if (ev.confirm) {
        wbShowConfirm(true, ev.confirm.desc || lbl("Потрібне підтвердження", "Confirmation required"), ev.confirm.code || null);
        st.textContent = lbl("⏸ очікує підтвердження", "⏸ awaiting confirm");
        return { paused: true, acc };
      } else if (ev.done) {
        if (ev.text) { acc = ev.text; out.dataset.raw = acc; out.innerHTML = mdSimple(acc); }
        st.textContent = lbl("готово", "done") + " · " + esc(ev.mode || "") + " · " + (ev.iters || 0) + " iters";
      }
    }
  }
  return { paused: false, acc };
}

function wbStreamStart() {
  const btn = document.getElementById("wbSend"), stop = document.getElementById("wbStop");
  btn.disabled = true; stop.style.display = "";
  if (wbAbort) wbAbort.abort();
  wbAbort = new AbortController();
  return wbAbort;
}
function wbStreamEnd() {
  document.getElementById("wbSend").disabled = false;
  const stop = document.getElementById("wbStop");
  if (stop) stop.style.display = "none";
  wbAbort = null;
}
async function wbSend() {
  const input = document.getElementById("wbInput");
  const text = input.value.trim(); if (!text) return;
  const out = document.getElementById("wbOut"), trace = document.getElementById("wbTrace");
  const st = document.getElementById("wbStatus");
  out.innerHTML = ""; trace.innerHTML = ""; wbShowConfirm(false);
  st.textContent = lbl("стрім…", "streaming…");
  const ac = wbStreamStart();
  try {
    const resp = await fetch("/platform/api/workbench/ask", { method: "POST",
      headers: headers(), credentials: "same-origin", signal: ac.signal,
      body: JSON.stringify({ text, mode: wbMode }) });
    if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
    await wbProcessStream(resp, { out, trace, st, acc: "" });
  } catch (e) {
    if (e.name === "AbortError") { st.textContent = lbl("зупинено", "stopped"); return; }
    showErr(e.message); st.textContent = lbl("помилка", "error");
  }
  wbStreamEnd();
}
async function wbResume(result, origin) {
  const out = document.getElementById("wbOut"), trace = document.getElementById("wbTrace");
  const st = document.getElementById("wbStatus");
  st.textContent = lbl("продовження…", "resuming…");
  const acc = document.getElementById("wbOut").dataset.raw || "";
  const ac = wbStreamStart();
  try {
    const resp = await fetch("/platform/api/workbench/resume", { method: "POST",
      headers: headers(), credentials: "same-origin", signal: ac.signal,
      body: JSON.stringify({ result, origin: origin || "", mode: wbMode }) });
    if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
    await wbProcessStream(resp, { out, trace, st, acc });
  } catch (e) {
    if (e.name === "AbortError") { st.textContent = lbl("зупинено", "stopped"); return; }
    showErr(e.message); st.textContent = lbl("помилка", "error");
  }
  wbStreamEnd();
}
async function wbApprove() {
  if (!wbPendingCode) return;
  const st = document.getElementById("wbStatus");
  try {
    const d = await api("/platform/api/workbench/confirm", { method: "POST", body: { code: wbPendingCode } });
    const adminCode = wbParseAdminConfirm(d.result);
    if (adminCode) {
      wbShowConfirm(true, (d.result || "").replace(_WB_ADMIN_RE, "").trim(), adminCode);
      st.textContent = "admin confirm";
      return;
    }
    wbShowConfirm(false);
    await wbResume(d.result || "", d.origin || "");
  } catch (e) { showErr(e.message); }
}
async function wbDeny() {
  try {
    await api("/platform/api/workbench/cancel", { method: "POST", body: {} });
    wbShowConfirm(false);
    document.getElementById("wbStatus").textContent = lbl("скасовано", "cancelled");
  } catch (e) { showErr(e.message); }
}

// ---------------- Jobs (P2) ----------------
function jobStatusBadge(st) {
  const s = String(st || "?");
  const cls = s === "done" ? "on" : (s === "failed" ? "off" : "on");
  return `<span class="badge ${cls}">${esc(s)}</span>`;
}
function renderJobs() {
  const el = document.getElementById("panel-jobs");
  if (!el.dataset.init) {
    el.dataset.init = "1";
    el.innerHTML =
      '<div class="toolbar"><textarea id="jobText" placeholder="' + lbl("Запит для background agent…", "Background agent prompt…") + '" style="flex:1;min-width:200px;min-height:56px"></textarea>' +
      '<select id="jobType"><option value="agent_turn">agent_turn</option><option value="deep_research">deep_research</option><option value="subagent">subagent</option><option value="agent_team">agent_team</option></select>' +
      '<select id="jobMode"><option value="auto">auto</option><option value="chat">chat</option>' +
      '<option value="agent">agent</option><option value="hybrid">hybrid</option></select>' +
      '<button type="button" class="primary" id="jobCreate">+ ' + lbl("Створити job", "Create job") + '</button>' +
      '<label class="chk" style="font-size:12px;color:var(--muted)"><input type="checkbox" id="jobAuto" checked /> ' + lbl("авто 5с", "auto 5s") + '</label></div>' +
      '<div id="jobsOut"></div>';
    el.querySelector("#jobCreate").addEventListener("click", jobCreate);
    el.querySelector("#jobAuto").addEventListener("change", (ev) => {
      clearInterval(jobsTimer);
      if (ev.target.checked) jobsTimer = setInterval(loadJobs, 5000);
    });
  }
  loadJobs();
  clearInterval(jobsTimer);
  const auto = document.getElementById("jobAuto");
  if (auto && auto.checked) jobsTimer = setInterval(loadJobs, 5000);
}
async function jobCreate() {
  const text = document.getElementById("jobText").value.trim();
  if (!text) return toast(lbl("вкажи текст", "enter text"));
  try {
    const mode = document.getElementById("jobMode").value;
    const job_type = document.getElementById("jobType").value;
    const j = await api("/platform/api/jobs", { method: "POST", body: { text, mode, job_type } });
    toast("job " + j.id); document.getElementById("jobText").value = ""; loadJobs();
  } catch (e) { showErr(e.message); }
}
async function loadJobs() {
  const out = document.getElementById("jobsOut"); if (!out) return;
  try {
    const d = await api("/platform/api/jobs?limit=25");
    if (!d.jobs.length) { out.innerHTML = '<div class="empty">' + lbl("Немає jobs", "No jobs") + '.</div>'; return; }
    let tbl = "<table><tr><th>ID</th><th>Status</th><th>" + lbl("Прогрес", "Progress") + "</th><th>" + lbl("Створено", "Created") + "</th><th>Payload</th><th></th></tr>";
    for (const j of d.jobs) {
      const ts = j.created_at ? new Date(j.created_at * 1000).toLocaleString("uk-UA") : "—";
      const pl = esc(JSON.stringify(j.payload || {}).slice(0, 80));
      const hl = highlightJobId && String(j.id) === String(highlightJobId) ? " job-highlight" : "";
      const cancel = j.status === "queued"
        ? `<button type="button" class="danger" data-jcancel="${esc(j.id)}">` + lbl("скасувати", "cancel") + `</button>` : "";
      tbl += `<tr class="${hl}"><td class="mono">${esc(j.id)}</td><td>${jobStatusBadge(j.status)}</td><td>${j.progress||0}%</td>` +
        `<td class="mono">${ts}</td><td class="mono">${esc(j.type||"agent_turn")}: ${pl}</td><td>${cancel}</td></tr>`;
      if (j.result) tbl += `<tr class="${hl}"><td colspan="6" class="lbl">→ ${esc(String(j.result).slice(0,300))}</td></tr>`;
      if (j.error) tbl += `<tr class="${hl}"><td colspan="6" class="lbl" style="color:var(--bad)">✗ ${esc(j.error)}</td></tr>`;
    }
    if (highlightJobId) highlightJobId = null;
    out.innerHTML = '<div class="card wide">' + tableWrap(tbl + "</table>") + "</div>";
    out.querySelectorAll("[data-jcancel]").forEach((btn) => {
      btn.addEventListener("click", () => {
        confirmModal(lbl("Скасувати job?", "Cancel job?"), btn.dataset.jcancel, async () => {
          try { await api("/platform/api/jobs/" + btn.dataset.jcancel, { method: "DELETE" }); toast(lbl("скасовано", "cancelled")); loadJobs(); }
          catch (e) { showErr(e.message); }
        });
      });
    });
  } catch (e) { showErr(e.message); out.innerHTML = ""; }
}

  activePlanId = p.id;
  const v = document.getElementById("planViewer");
  let steps = (p.steps || []).map((s) =>
    `<tr><td>${s.id}</td><td>${esc(s.title)}</td><td>${esc(s.status||"pending")}</td><td class="mono">${esc((s.detail||"").slice(0,120))}</td></tr>`
  ).join("");
  const risks = (p.risks || []).map((r) => `<li>${esc(r)}</li>`).join("");
  const canApprove = p.status === "pending";
  const canExec = p.status === "approved";
  v.innerHTML =
    `<div class="card wide"><h3>${esc(p.summary||"")} ${planBadge(p.status)}</h3>` +
    `<p class="mono">ID: ${esc(p.id)}</p>` +
    (risks ? `<ul>${risks}</ul>` : "") +
    tableWrap("<table><tr><th>#</th><th>" + lbl("Крок", "Step") + "</th><th>Status</th><th>Detail</th></tr>" + steps + "</table>") +
    `<div class="toolbar">` +
    (canApprove ? '<button type="button" class="primary" id="planApprove">' + lbl("Підтвердити", "Approve") + '</button><button type="button" class="danger" id="planDeny">' + lbl("Відхилити", "Deny") + '</button>' : "") +
    (canExec ? '<button type="button" class="primary" id="planExec">' + lbl("Виконати", "Execute") + '</button>' : "") +
    `</div>` +
    (p.result ? `<pre class="mono">${esc(String(p.result).slice(0,4000))}</pre>` : "") +
    `</div>`;
  const ap = document.getElementById("planApprove");
  if (ap) ap.addEventListener("click", () => planAction("approve"));
  const dn = document.getElementById("planDeny");
  if (dn) dn.addEventListener("click", () => planAction("deny"));
  const ex = document.getElementById("planExec");
  if (ex) ex.addEventListener("click", () => planAction("execute"));
  if (p.status === "executing") startPlanPoll(p.id);
  else clearInterval(planPoll);
}
async function planAction(action) {
  if (!activePlanId) return;
  try {
    if (action === "execute") {
      toast(lbl("виконується…", "executing…"));
      const r = await api("/platform/api/plans/" + activePlanId + "/execute", { method: "POST", body: {} });
      planShow(r.plan || r);
    } else {
      const r = await api("/platform/api/plans/" + activePlanId + "/" + action, { method: "POST", body: {} });
      planShow(r);
    }
    loadPlansList();
  } catch (e) { showErr(e.message); }
}
function startPlanPoll(id) {
  clearInterval(planPoll);
  planPoll = setInterval(async () => {
    try {
      const p = await api("/platform/api/plans/" + id);
      planShow(p);
      if (p.status !== "executing") clearInterval(planPoll);
    } catch (e) { clearInterval(planPoll); }
  }, 3000);
}
async function loadPlansList() {
  const out = document.getElementById("plansList"); if (!out) return;
  try {
    const d = await api("/platform/api/plans?limit=15");
    if (!d.plans.length) { out.innerHTML = '<div class="empty">' + lbl("Планів ще немає", "No plans yet") + '.</div>'; return; }

    for (const p of d.plans) {
      tbl += `<tr style="cursor:pointer" data-pid="${esc(p.id)}"><td class="mono">${esc(p.id)}</td><td>${planBadge(p.status)}</td><td>${esc((p.summary||"").slice(0,80))}</td></tr>`;
    }
    out.innerHTML = '<div class="card wide">' + tableWrap(tbl + "</table>") + "</div>";
    out.querySelectorAll("[data-pid]").forEach((row) => {
      row.addEventListener("click", async () => {
        const p = await api("/platform/api/plans/" + row.dataset.pid);

}

    '<select id="pgMode"><option value="auto">auto</option><option value="agent">agent</option>' +

    '<button type="button" id="pgRun">▶ ' + lbl("Запустити", "Run") + '</button></div>' +
    '<textarea id="pgInput" rows="4" placeholder="' + lbl("Запит…", "Prompt…") + '" style="width:100%;margin-top:8px"></textarea>' +
    '<div id="pgOut" class="mono" style="white-space:pre-wrap;margin-top:10px;color:var(--muted)"></div></div>';
  el.querySelector("#pgRun").addEventListener("click", pgRun);
}
async function pgRun() {
  const input = (document.getElementById("pgInput").value || "").trim();
  const mode = document.getElementById("pgMode").value;
  if (!input) { showErr(lbl("Введи запит", "Enter a prompt")); return; }
  const out = document.getElementById("pgOut");
  out.textContent = LOADING;
  try {
    const r = await api("/platform/api/developer/playground", { method: "POST", body: { input, mode } });
    out.textContent = r.output || "—";
  } catch (e) { out.textContent = ""; showErr(e.message); }
}

const RENDER = { overview: renderOverview, workbench: renderWorkbench, memory: renderMemory,
  projects: renderProjects, jobs: renderJobs, planning: renderPlanning, research: renderResearch,
  mcp: renderMcp, connectors: renderConnectors, skills: renderSkills, subagents: renderSubagents,
  teams: renderTeams, hooks: renderHooks, logs: renderLogs, settings: renderSettings, users: renderUsers,
  models: renderModels, improve: renderImprove, developer: renderDeveloper,
  playground: renderPlayground };

const initTab = (location.hash || "#overview").slice(1);
switchTab(TITLES[initTab] ? initTab : "overview", false);
</script>
